name: L2TP dependency regression

on:
  push:
    paths:
      - 'deps/veepin/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/l2tp-compat-test.yml'
  pull_request:
    paths:
      - 'deps/veepin/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/l2tp-compat-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: deps/veepin/go.sum
      - name: Check patch formatting
        run: |
          test -z "$(gofmt -l deps/veepin/internal/ikev1/ikuai*.go deps/veepin/internal/ikev1/diagnostics*.go deps/veepin/l2tp/server_udp_linux_test.go deps/veepin/internal/cryptoutil/modp3072_test.go)"
      - name: Test L2TP dependency
        working-directory: deps/veepin
        run: go test -mod=readonly -count=1 ./internal/cryptoutil ./internal/ikev1 ./internal/l2tp ./l2tp
      - name: Check compatibility changes for races
        working-directory: deps/veepin
        run: go test -mod=readonly -race -count=1 -run 'TestIKuai|TestMODP3072|TestRetransmitDiagnostics|TestInitialSendError|TestTimeoutWithoutSendError|TestIKESendFailure|TestTunnelSourceNATDiagnostic|TestServerWildcard|TestIKERepliesFollowObservedTransport' ./internal/cryptoutil ./internal/ikev1 ./internal/l2tp ./l2tp
