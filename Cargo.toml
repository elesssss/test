[package]
name = "anyst"
version = "0.2.5"
edition = "2021"
description = "A port tunnel with TCP (AnyTLS-like) and UDP (TUIC-like) support using shared TLS certificates"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "bloom"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
bytes = "1"
anyhow = "1"
rustls-native-certs = "0.8"
sha2 = "0.10"
subtle = "2"
md-5 = "0.10"
rand = "0.8"
